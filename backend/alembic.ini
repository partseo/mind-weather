# ============================================================
#  alembic.ini — 마이그레이션 설정
#  sqlalchemy.url은 .env의 DATABASE_URL을 참조 (env.py에서 오버라이드)
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# env.py에서 DATABASE_URL 환경변수로 오버라이드됨
sqlalchemy.url = postgresql+asyncpg://autoexport:autoexport@localhost:5432/autoexport

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
